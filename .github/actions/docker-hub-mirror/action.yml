name: Docker Hub mirror for the runner's daemon
description: >
  Point the runner's Docker daemon at mirror.gcr.io for docker.io pulls, then
  restart it and check that it took the setting.

# For every pull the runner's own daemon makes: `docker run`, `docker compose
# up --build`, `docker/build-push-action` without a setup-buildx step, and the
# `moby/buildkit` image that setup-buildx pulls when it boots a builder. Pulls
# made INSIDE that builder go through .github/buildkitd.toml instead — the
# reason for both is written there.
#
# The daemon tries the mirror first and falls back to Docker Hub on its own, so
# an outage at the mirror costs a retry, not the job.
#
# Not every image this covers is pinned by digest (the CI test containers use
# tags), so for those the mirror's copy of the tag is what runs.
#
# Merged, not overwritten: hosted runners ship a daemon.json of their own, and
# replacing it would drop whatever the image put there. A file that is not valid
# JSON stops the step before anything is replaced.

runs:
  using: composite
  steps:
    - name: Add mirror.gcr.io to the daemon's registry mirrors
      shell: bash
      run: |
        set -euo pipefail
        cfg=/etc/docker/daemon.json
        current=$(sudo cat "$cfg" 2>/dev/null || true)
        # Absent, empty or whitespace-only: start from an empty object. jq on
        # empty input prints nothing, which would empty the file.
        if [ -z "${current//[[:space:]]/}" ]; then current='{}'; fi
        printf '%s' "$current" \
          | jq '.["registry-mirrors"] = ((.["registry-mirrors"] // []) + ["https://mirror.gcr.io"] | unique)' \
          | sudo tee "$cfg.new" > /dev/null
        sudo mv "$cfg.new" "$cfg"
        sudo systemctl restart docker
        # A daemon that came back without the setting would pull anonymously
        # again and say nothing, so ask it rather than trusting the file.
        mirrors=$(docker info --format '{{json .RegistryConfig.Mirrors}}')
        echo "registry mirrors: $mirrors"
        case "$mirrors" in
          *'https://mirror.gcr.io'*) ;;
          *) echo "::error::Docker daemon did not take the mirror setting: $mirrors"; exit 1 ;;
        esac

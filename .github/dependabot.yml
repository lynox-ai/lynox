version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
    # `@types/node` describes the Node API the code may use; it must not run AHEAD of the runtime
    # the code ships on. Every stage of the Dockerfile runs `node:22-slim` and `engines.node` is `>=22`, so a
    # newer major lets the type check pass code that calls APIs Node 22 does not have — a check
    # that reports clean on exactly the error it exists for. Majors are therefore not proposed
    # here. The types should move DOWN to 22 (measured 2026-10-01: one signature error in
    # src/index.ts, no use of a missing runtime API); that is a separate, deliberate change, and
    # raising them again belongs with a runtime upgrade, not with a weekly bump.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - ci
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch

name: Public-Repo Guard

# Blocks internal infrastructure / control-plane / ops leaks from landing in
# this PUBLIC, source-available repo — the class gitleaks doesn't catch
# (staging hostnames, CP DB schema, SSH-as-root chains, internal paths).
#
# This is the authoritative gate: the lefthook pre-push hook runs the same
# scan locally for fast feedback, but `git push --no-verify` bypasses it —
# this job does not. It is a required status check on main.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  public-repo-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # check-meta walks base..head, which a shallow checkout cannot do.
          fetch-depth: 0

      - name: Scan tracked tree for internal-infra leaks
        # LYNOX_PRIVATE_NAMES_RE carries the customer/third-party name pattern,
        # which must not live in this public repo. It is deliberately NOT set yet:
        # the customer-name class currently runs at pre-push only, and this job
        # opts out of it rather than failing over a secret that does not exist.
        #
        # Arming it later needs no change here — set the secret and the class goes
        # live on the next run, because --allow-missing-names only governs what
        # happens when the pattern is ABSENT. Set it in BOTH stores: Dependabot
        # reads from its own (Settings → Secrets → Dependabot).
        #
        # The warning below exists so "skipped" cannot become the quiet permanent
        # state. A guard that silently opts out of its own class is worse than one
        # that was never written, so the skip is annotated on every run and shows
        # up in the PR, not only deep in a log.
        env:
          LYNOX_PRIVATE_NAMES_RE: ${{ secrets.LYNOX_PRIVATE_NAMES_RE }}
        run: |
          if [ -z "${LYNOX_PRIVATE_NAMES_RE:-}" ]; then
            echo "::warning title=private-name class is INACTIVE::LYNOX_PRIVATE_NAMES_RE is unset, so the customer-name class did not run. It is enforced at pre-push only. Set the secret (Actions AND Dependabot) to arm it here too."
          fi
          bash scripts/public-repo-guard.sh --allow-missing-names

      - name: Scan commit messages and PR text for private names
        # On a PR this is the preventive pass: it fails while the branch can still
        # be rewritten and the title/body can still be edited. Everything arrives
        # through the environment, never interpolated into the command line (same
        # shape as no-ai-attribution.yml).
        if: github.event_name == 'pull_request'
        env:
          LYNOX_PRIVATE_NAMES_RE: ${{ secrets.LYNOX_PRIVATE_NAMES_RE }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bash scripts/public-repo-guard.sh --allow-missing-names check-meta "$BASE_SHA" "$HEAD_SHA"

      - name: Scan the merge commit that actually landed on main
        # The PR pass above cannot see this one. Squash-merge is the default here,
        # and the squash message is composed in the merge dialog — it is neither
        # the PR body nor any branch commit, so a name typed there reaches main
        # unchecked, into the one surface that cannot be edited afterwards.
        #
        # This runs after the fact and prevents nothing; it exists so the leak is
        # KNOWN within minutes rather than never. A red main is the signal to
        # decide about the message while it is still the tip.
        if: github.event_name == 'push'
        env:
          LYNOX_PRIVATE_NAMES_RE: ${{ secrets.LYNOX_PRIVATE_NAMES_RE }}
          # `before` is the previous tip. On the first push of a new branch it is
          # all-zeroes and unresolvable — the guard fails loudly on that rather
          # than reporting an unwalked range as clean, so fall back to the single
          # commit that was pushed.
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          if git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            bash scripts/public-repo-guard.sh --allow-missing-names check-meta "$BEFORE_SHA" "$AFTER_SHA"
          else
            bash scripts/public-repo-guard.sh --allow-missing-names check-meta "${AFTER_SHA}~1" "$AFTER_SHA"
          fi

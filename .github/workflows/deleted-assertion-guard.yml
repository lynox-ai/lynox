name: deleted-assertion-guard

# ⭐ WHY `pull_request` AND NOT `push`. The guard needs two commits: the base the pull request
# started from and its head. A push event gives neither reliably — `github.event.before` is the
# previous commit on the branch, not the merge base, so on a branch with several commits it would
# compare against the wrong point and report a deletion that an earlier commit of the same branch
# had already made.
#
# ⛔ IT REPORTS, IT DOES NOT GATE — and the mapping is the opposite of the obvious one:
#   exit 0 → pass        nothing to report
#   exit 1 → PASS        there IS something to report; printed as a warning, never red
#   exit 2 → FAIL        it could not look
#   anything else → FAIL also ill health
# What is gated is the instrument's HEALTH, not its judgement. The reason: the check compares the
# NUMBER of test cases per file, which is a narrower proxy than the property — deleting two cases
# while adding three keeps the number up and escapes. A proxy may inform a person; it may not stop
# a merge. And a check that silently stops looking still reads as coverage, which is why ill health
# is the one thing that goes red.
#
# ⚠ An earlier version had this backwards and it blocked on a finding. It also mapped an uncaught
# crash — node's default exit of 1 — onto "a deleted assertion still holds", announcing a finding
# nobody had measured.

on:
  pull_request:
    # ⚠ A FILTER, not the candidate set. The candidate set comes from the runner's own file list at
    # run time (`vitest list`); this only decides whether the job starts at all. Kept wide on
    # purpose: a path filter that tried to mirror the runner's include patterns would be a second,
    # drifting copy of them.
    paths:
      - '**/*.test.ts'
      - '**/*.spec.ts'
      - '**/*.test.tsx'
      - '**/*.spec.tsx'
      - 'scripts/deleted-assertion-guard.mjs'
      - '.github/workflows/deleted-assertion-guard.yml'

permissions:
  contents: read

concurrency:
  group: deleted-assertion-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deleted-assertion-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # fetch-depth 0: the guard reads the BASE version of a file with `git show <base>:<path>`,
      # which a shallow clone does not have.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1
        with:
          fetch-depth: 0
          # `head.sha`, deliberately — NOT `head.ref`. A ref is a name an author chooses and is
          # the documented injection surface; a sha is the commit this run was triggered for.
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: 22

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v4.2.0

      - run: pnpm install --frozen-lockfile

      # The guard refuses to run on a dirty tree. `pnpm install` can touch the lockfile on a
      # mismatch, so the state is asserted here rather than discovered as an exit 2 later.
      - name: Assert the tree is clean before the guard writes to it
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            echo "::warning::the tree is dirty after install; the guard will exit 2 and not block"
            git status --porcelain | head -20
          fi

      - name: Run the old test files against the new source
        # ⛔ The two SHAs go through `env:` and NOT into the command line. They are 40-hex values
        # that GitHub produces, so interpolating them would in fact be safe — but the safety would
        # rest on a claim about the field's FORMAT, and a later edit that swaps in `head.ref` or a
        # title inherits the shape without inheriting the argument. `env:` is safe by structure.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # ⛔ `|| CODE=$?`, and NOT a bare call followed by `CODE=$?`. GitHub invokes a `run:`
          # block as `bash -e {0}`, so `-e` is already on before the first line of this script
          # executes and `set -uo pipefail` does not turn it off. Measured: with a bare call the
          # step ABORTS the moment the script exits non-zero — the `case` below never runs, no
          # warning is printed, and the job goes RED on a finding. That is the exact polarity this
          # design forbids, dressed in a mapping that looks like it governs the step and does not.
          # A command on the left of `||` is exempt from `-e` regardless of who set it.
          set -uo pipefail
          CODE=0
          node scripts/deleted-assertion-guard.mjs "$BASE_SHA" "$HEAD_SHA" || CODE=$?
          # 0 = nothing to report or every deletion was forced · 1 = proven unnecessary · 2 = could
          # not check. Only 1 is a failure, and the mapping is spelled out here so that a future
          # edit has to decide deliberately rather than inherit `set -e`.
          case "$CODE" in
            0) echo "guard: nothing to report" ;;
            1) echo "::warning::guard: test cases vanished and still pass — see the lines above. ADVISORY, nothing is blocked."; exit 0 ;;
            2) echo "::error::guard: could not check. The instrument's health is what this job gates."; exit 1 ;;
            *) echo "::error::guard: unexpected exit $CODE — treated as ill health"; exit 1 ;;
          esac

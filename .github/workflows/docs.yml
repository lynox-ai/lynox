name: Docs

on:
  push:
    branches: [main]
    paths: ['docs/**']
  pull_request:
    paths: ['docs/**']

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # onnxruntime-node's postinstall downloads only CUDA/TensorRT providers on
  # linux/x64 (~300 MB, never loaded: the CPU runtime ships in the npm package).
  # Skipping it removes a CDN dependency from every install.
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '22' }
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - run: pnpm install --frozen-lockfile
        working-directory: docs
      - run: pnpm build
        working-directory: docs

      # Auto-deploy to Cloudflare Pages staging branch on every main push.
      # Maps to staging.docs.lynox.ai (custom domain bound to the 'staging'
      # branch of the lynox-docs Pages project).
      - name: Deploy to Cloudflare Pages (staging)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name=lynox-docs --branch=staging --commit-dirty=true

name: Fence Guard

# Forbids hand-built model-facing fences: any code that produces a string in
# which a COINED element is opened and closed with non-literal content between
# them must go through `renderFence(token, payload)`, which neutralises the
# payload's own close tag in every encoding.
#
# Why a guard and not a review habit: four review rounds tried to enumerate
# which frames are exposed and each found one more, because the question needs
# dataflow and stays open. This asks the closable question instead — is any
# fence hand-built? — and drives the set to EMPTY. It needs no count to be
# correct.
#
# The rule is over the EFFECT, not a syntax form. Three construction shapes were
# measured in the tree before it was written: one template literal (most), an
# array assembled with push/join (`<api_bootstrap_hints>`), and an interpolated
# tag name (`renderProvenanceFact`). A rule about template literals would have
# missed two of them silently.
#
# Every exception carries its own reason, never a path or filetype pattern, and
# the guard FAILS when an exception matches nothing — a dead exception is a hole
# nobody sees.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  fence-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '22' }
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with: { version: '10' }
      - run: pnpm install --frozen-lockfile
      - name: No hand-built fences
        run: node scripts/fence-guard.mjs

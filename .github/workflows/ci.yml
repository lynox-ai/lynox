name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**']
  pull_request:
    paths-ignore: ['docs/**']

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { fetch-depth: 0 }
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: '8.21.2'
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz
          sudo mv gitleaks /usr/local/bin/
      - name: Run gitleaks
        run: gitleaks detect --source . --verbose --redact

  test:
    runs-on: ubuntu-latest
    # The suite spawns subprocesses (the cross-repo convention pins run workflow
    # shell against a stubbed curl). Their own timeout signals the shell it
    # started, not that shell's own children — an orphaned grandchild outlives
    # it. Without a job ceiling such a process would burn the runner's 6h
    # default instead of failing. Matches `smoke` below.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '22' }
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with: { version: '10' }
      - run: pnpm install --frozen-lockfile

      # Dependency audit via osv-scanner. audit-ci was replaced 2026-04-15
      # because it shells out to `pnpm audit`, and pnpm audit still hits the
      # retired npm legacy advisory endpoint (HTTP 410). osv-scanner reads
      # pnpm-lock.yaml natively and queries OSV.dev (aggregates GHSA + npm
      # advisories + more). High/critical fail the job; moderate/low are listed
      # and do not block, which keeps the prior Phase 1 policy — and a finding
      # whose severity the report does not state now fails too, which is the
      # change, not a detail. See scripts/osv-report-gate.mjs for the
      # measurement: the whole `MAL-` feed carries no severity, so "unclassified
      # means not blocking" made OSV's malicious-package data decorative.
      #
      # PINNED AND CHECKSUMMED. `releases/latest` fetched a different executable
      # on every run, `sudo mv`'d it onto PATH, and ran it over the checkout —
      # and it is the binary that decides whether an advisory blocks a merge.
      # The hash lives in this file rather than beside the artefact on purpose:
      # the release publishes `osv-scanner_SHA256SUMS`, but fetching the
      # expectation from the same place as the bytes only proves the transfer.
      # Written here it is under review like an action SHA. Taken from that
      # published file AND recomputed from the downloaded binary, 2026-09-02.
      #
      # ⚠ Bounded: the attestation refuses bytes that no google/osv-scanner
      # release attested. It does NOT bind them to this tag, so a downgrade to a
      # genuinely published older release passes the checksum only because the
      # checksum moves with the pin — the provenance check alone would not catch
      # it. Downgrade-to-a-real-vulnerable-version is covered by nothing here.
      #
      # This mirrors lynox-pro's audit job (pro#813). The two are separate files
      # with no mechanism keeping them honest, which is its own recorded gap.
      - name: Install osv-scanner
        env:
          OSV_SCANNER_VERSION: '2.5.1'
          OSV_SCANNER_SHA256: 'f9f25499a2c8cc367b3af45df2ea7eeca7fbccceab9c35079968f4b3652194be'
          # Bundle verification reads a signature, not the API, so it needs no
          # token. The line is here so a future `gh` that reinstates auth turns
          # into nothing rather than a permanently red required check — which is
          # the state that earns a `|| true`. Read-only scope.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64" -o /tmp/osv-scanner
          echo "${OSV_SCANNER_SHA256}  /tmp/osv-scanner" | sha256sum -c -
          # After the checksum because that one is local and free, before the
          # `sudo mv` because neither control is worth anything once the file is
          # on PATH. Both flags below are load-bearing: without `--bundle` this
          # queries the attestations API and 404s on a SLSA-generator artefact.
          curl -sSfL "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/multiple.intoto.jsonl" -o /tmp/osv-provenance.jsonl
          gh attestation verify /tmp/osv-scanner \
            --bundle /tmp/osv-provenance.jsonl \
            --repo google/osv-scanner \
            --predicate-type https://slsa.dev/provenance/v0.2 \
            --signer-repo slsa-framework/slsa-github-generator
          chmod +x /tmp/osv-scanner
          sudo mv /tmp/osv-scanner /usr/local/bin/osv-scanner
          # Diagnostic, not the control — the checksum already fixes the bytes.
          # It catches a hand-edit that moves the pin without moving the hash.
          osv-scanner --version | tee /tmp/osv-version
          grep -qx "osv-scanner version: ${OSV_SCANNER_VERSION}" /tmp/osv-version

      # The exit code is CAPTURED and handed to the gate rather than discarded.
      # Measured on 2.5.1: an unreadable lockfile exits 127 and a lockfile that
      # yields no packages exits 128, and neither writes the report. Under the
      # old `|| true` that was survivable only by accident — the missing file
      # broke the jq that followed. The accident is what is being removed.
      - name: Scan dependencies (high+critical hard-fail)
        run: |
          set -euo pipefail
          set +e
          osv-scanner scan source --lockfile=pnpm-lock.yaml --format=json --output-file=/tmp/osv.json
          OSV_RC=$?
          set -e
          node scripts/osv-report-gate.mjs --report /tmp/osv.json --rc "${OSV_RC}"

      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm exec vitest run --coverage
      - name: Check coverage threshold
        run: node --input-type=module -e "import{readFileSync}from'node:fs';const r=JSON.parse(readFileSync('./coverage/coverage-summary.json','utf8')).total;const p=r.lines.pct;console.log('Line coverage '+p+'%');if(p<65)process.exit(1)"

  docker-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          push: false
          tags: lynox:ci-scan
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: lynox:ci-scan
          format: table
          exit-code: 1
          severity: CRITICAL

  # Live IMAPS/SMTPS integration tests against a real GreenMail container.
  # In the `test` job above these silently skip (describe.skipIf when the TCP
  # probe fails), so a regression in ImapSmtpProvider or the inbox runtime
  # would never trip CI. This job boots GreenMail in the runner, waits for
  # IMAPS, and runs the two greenmail spec files explicitly. Separate from
  # `test` so coverage data stays single-source and a flaky mail-server boot
  # doesn't taint the main coverage gate.
  greenmail:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '22' }
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with: { version: '10' }
      - run: pnpm install --frozen-lockfile

      - name: Start GreenMail
        run: |
          docker run --rm -d --name lynox-greenmail \
            -p 3025:3025 -p 3143:3143 -p 3465:3465 -p 3993:3993 -p 8080:8080 \
            -e GREENMAIL_OPTS='-Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled' \
            greenmail/standalone:2.1.8

      - name: Wait for IMAPS to accept connections
        run: |
          for i in $(seq 1 30); do
            if nc -z 127.0.0.1 3993 2>/dev/null; then
              echo "GreenMail IMAPS ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "FAIL: GreenMail never became reachable"
          docker logs lynox-greenmail 2>&1 | tail -40
          exit 1

      - name: Run greenmail integration suite
        run: pnpm exec vitest run tests/integration/mail-greenmail.test.ts tests/integration/mail-greenmail-adversarial.test.ts

      - name: Stop GreenMail
        if: always()
        run: docker rm -f lynox-greenmail 2>/dev/null || true

  # Build the production image via docker-compose.smoke.yml and run the
  # Playwright smoke (tests/smoke/) against it. This exists so the smoke
  # suite is exercised on every PR — without it, regressions in
  # tests/smoke/ go undetected until someone manually runs
  # scripts/smoke-local.sh (which happened in May 2026: the inbox-phase2
  # APIRequestContext cookie regression silently shipped via PR #283).
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '22' }
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with: { version: '10' }
      - run: pnpm install --frozen-lockfile
      - name: Run smoke (build + up + playwright + teardown)
        run: bash scripts/smoke-local.sh --verbose
      - name: Upload playwright trace artifacts on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smoke-playwright-traces
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

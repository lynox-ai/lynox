name: CI

on:
  push:
    branches: [main]
  pull_request:
# No `paths-ignore` here, on purpose. It used to skip this whole workflow for docs-only changes,
# and a separate stub workflow (also named `CI`) re-emitted the required job names for them. On a
# MIXED pull request both workflows started, so every required name was reported twice — once for
# real, once as a stub job skipped by its condition, which GitHub counts as success — in no
# guaranteed order. One workflow now decides once, in `detect`, and every required name has
# exactly one run per head.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # onnxruntime-node's postinstall downloads only CUDA/TensorRT providers on
  # linux/x64 (~300 MB, never loaded: the CPU runtime ships in the npm package).
  # Skipping it removes a CDN dependency from every install.
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  # Decides ONCE whether this change is docs-only; the required jobs below read its answer.
  # Not a required check itself.
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      docs-only: ${{ steps.check.outputs.docs-only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - id: check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # ONE call; its answer goes to the output and, with the verdict, to the log and summary —
          # a skipped required job carries no log of its own, so this is where "docs-only, core
          # step not run" is readable.
          bash scripts/ci-docs-only.sh "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/docs-only.out" 2> "$RUNNER_TEMP/docs-only.why"
          cat "$RUNNER_TEMP/docs-only.out" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/docs-only.out" "$RUNNER_TEMP/docs-only.why"
          { echo "### detect"; cat "$RUNNER_TEMP/docs-only.out" "$RUNNER_TEMP/docs-only.why"; } >> "$GITHUB_STEP_SUMMARY"

  # gitleaks runs on EVERY change, docs-only included: a secret pasted into a .md file is one of
  # the likelier ways this public repo would leak one.
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - name: Install gitleaks
        uses: ./.github/actions/install-gitleaks
      - name: Check the gitleaks config still detects
        # A config with no active rules passes every scan below without a sign.
        run: bash scripts/gitleaks-config-canary.sh
      - name: Run gitleaks
        run: gitleaks detect --source . --verbose --redact

  # eslint runs beside `test`, not inside it. Inside, its ~6 minutes ran before vitest in the same
  # job, and from 13.10. to 19.10. the job's mean on main grew from 14.7 to 17.8 minutes against a
  # 20-minute ceiling (vitest 7.8 → 10.4, lint and typecheck flat), so two pull requests were
  # cancelled at the timeout with no failing test. Unconditional like `test`: this is the CI twin
  # of the pre-commit lint (scripts/lint-changed.mjs) and covers a push made without it.
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '22' }
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint

  # `test` runs on docs-only changes too; it carries the osv gate, which may not be conditional
  # (tests/osv-workflow-pin.test.ts). Do not gate it on detect.
  test:
    runs-on: ubuntu-latest
    # Scoped because this job downloads a third-party executable and runs it
    # over the checkout, and because the install action is handed a token: the
    # comment that calls it read-only is now enforced rather than asserted.
    permissions:
      contents: read
    # The suite spawns subprocesses (the cross-repo convention pins run workflow
    # shell against a stubbed curl). Their own timeout signals the shell it
    # started, not that shell's own children — an orphaned grandchild outlives
    # it. Without a job ceiling such a process would burn the runner's 6h
    # default instead of failing. The ceiling sits above the suite's own time,
    # not at it: the suite alone ran 18-20 min on main by late October 2026
    # (one run was cancelled at 20:03), so 20 cut off green runs.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '22' }
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - run: pnpm install --frozen-lockfile

      # Dependency audit via osv-scanner. audit-ci was replaced 2026-04-15
      # because it shells out to `pnpm audit`, and pnpm audit still hits the
      # retired npm legacy advisory endpoint (HTTP 410). osv-scanner reads
      # both lockfiles (the root and docs/) natively and queries OSV.dev (aggregates GHSA + npm
      # advisories + more). High/critical fail the job; moderate/low are listed
      # and do not block, which keeps the prior Phase 1 policy — and a finding
      # whose severity the report does not state now fails too, which is the
      # change, not a detail. scripts/osv-report-gate.mjs carries the
      # measurement behind it.
      #
      # The install is a composite action so the pin has ONE home; release.yml
      # and dep-scan-daily.yml call the same one.
      - uses: ./.github/actions/install-osv-scanner
        with:
          token: ${{ github.token }}

      # The exit code is CAPTURED and handed to the gate rather than discarded.
      # Measured on 2.5.1: an unreadable lockfile exits 127 and a lockfile that
      # yields no packages exits 128, and neither writes the report. One scan
      # PER LOCKFILE, on purpose: a single call over both exits 128 only when
      # BOTH yield nothing, so an empty docs lockfile beside a readable root one
      # scanned green. Each scan hands its own exit code to the gate. Under the
      # old `|| true` that was survivable only by accident — the missing file
      # broke the jq that followed. The accident is what is being removed.
      #
      # `--output-file` because `--output` is deprecated in 2.5.1 and prints a
      # warning; the file it writes is the same.
      - name: Scan dependencies (high+critical hard-fail)
        run: |
          set -euo pipefail
          set +e
          osv-scanner scan source --lockfile=pnpm-lock.yaml --format=json --output-file=/tmp/osv.json
          OSV_RC=$?
          osv-scanner scan source --lockfile=docs/pnpm-lock.yaml --format=json --output-file=/tmp/osv-docs.json
          OSV_DOCS_RC=$?
          set -e
          node scripts/osv-report-gate.mjs --report /tmp/osv.json --rc "${OSV_RC}" --report /tmp/osv-docs.json --rc "${OSV_DOCS_RC}"

      # Every override floor a lockfile records must also be resolved above, in
      # the root tree and in docs/. Neither `--frozen-lockfile` nor a plain
      # install re-resolves a version that is already locked, so a floor can be
      # recorded and never applied; the osv scan above catches that only when
      # the version left behind carries an advisory itself. After the install,
      # because the guard imports semver and yaml.
      - name: Recorded overrides are applied to both lockfiles
        run: node scripts/override-applied-guard.mjs

      - run: pnpm run typecheck
      - run: pnpm exec vitest run --coverage
      - name: Check coverage threshold
        run: node --input-type=module -e "import{readFileSync}from'node:fs';const r=JSON.parse(readFileSync('./coverage/coverage-summary.json','utf8')).total;const p=r.lines.pct;console.log('Line coverage '+p+'%');if(p<65)process.exit(1)"

  docker-scan:
    needs: detect
    # Skipped only on a docs-only change. If `detect` itself fails, this still runs: GitHub reports
    # a job that is skipped because a job it needs FAILED as not blocking the merge, so a plain
    # `needs` would turn a broken `detect` into three green required checks.
    if: ${{ !cancelled() && (needs.detect.result != 'success' || needs.detect.outputs.docs-only != 'true') }}
    runs-on: ubuntu-latest
    # Successful runs take 3-5 min (job time p95 4.2 min over 397 runs, 17-20 Oct 2026); one green
    # run still showed 12.07 min job time, most of it after its last step, so the bound leaves room
    # for that. Without a bound a stalled build holds the required check open for the 6 h default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/docker-hub-mirror
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          push: false
          tags: lynox:ci-scan
      # Same threshold as the release, staging and canary scans (`ignore-unfixed`). Node packages
      # stay covered without that filter by the osv gate in `test`, which reads pnpm-lock.yaml.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: lynox:ci-scan
          format: table
          exit-code: 1
          severity: CRITICAL
          ignore-unfixed: true
      # A scan that cannot see the OS packages passes the step above; this one fails on that.
      # The same pair runs in release.yml, so a pull request shows what the release will see.
      - name: List what the scan saw
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: lynox:ci-scan
          format: json
          output: trivy-packages.json
          list-all-pkgs: true
          scanners: vuln
          exit-code: '0'
      - name: The scan saw the OS packages
        run: |
          set -euo pipefail
          n=$(jq '[.Results[]? | select(.Class == "os-pkgs") | .Packages[]?] | length' trivy-packages.json)
          echo "OS packages the scan saw: $n"
          if [ "$n" -eq 0 ]; then
            echo "::error::the image scan saw no OS packages, so it could not judge them. Is /var/lib/dpkg removed in the Dockerfile?" >&2
            exit 1
          fi

  # Live IMAPS/SMTPS integration tests against a real GreenMail container.
  # In the `test` job above these silently skip (describe.skipIf when the TCP
  # probe fails), so a regression in ImapSmtpProvider or the inbox runtime
  # would never trip CI. This job boots GreenMail in the runner, waits for
  # IMAPS, and runs the two greenmail spec files explicitly. Separate from
  # `test` so coverage data stays single-source and a flaky mail-server boot
  # doesn't taint the main coverage gate.
  greenmail:
    needs: detect
    # Skipped only on a docs-only change. If `detect` itself fails, this still runs: GitHub reports
    # a job that is skipped because a job it needs FAILED as not blocking the merge, so a plain
    # `needs` would turn a broken `detect` into three green required checks.
    if: ${{ !cancelled() && (needs.detect.result != 'success' || needs.detect.outputs.docs-only != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '22' }
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/docker-hub-mirror

      - name: Start GreenMail
        run: |
          docker run --rm -d --name lynox-greenmail \
            -p 3025:3025 -p 3143:3143 -p 3465:3465 -p 3993:3993 -p 8080:8080 \
            -e GREENMAIL_OPTS='-Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled' \
            greenmail/standalone:2.1.8

      - name: Wait for IMAPS to accept connections
        run: |
          for i in $(seq 1 30); do
            if nc -z 127.0.0.1 3993 2>/dev/null; then
              echo "GreenMail IMAPS ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "FAIL: GreenMail never became reachable"
          docker logs lynox-greenmail 2>&1 | tail -40
          exit 1

      - name: Run greenmail integration suite
        run: pnpm exec vitest run tests/integration/mail-greenmail.test.ts tests/integration/mail-greenmail-adversarial.test.ts

      - name: Stop GreenMail
        if: always()
        run: docker rm -f lynox-greenmail 2>/dev/null || true

  # Build the production image via docker-compose.smoke.yml and run the
  # Playwright smoke (tests/smoke/) against it. This exists so the smoke
  # suite is exercised on every PR — without it, regressions in
  # tests/smoke/ go undetected until someone manually runs
  # scripts/smoke-local.sh (which happened in May 2026: the inbox-phase2
  # APIRequestContext cookie regression silently shipped via PR #283).
  smoke:
    needs: detect
    # Skipped only on a docs-only change. If `detect` itself fails, this still runs: GitHub reports
    # a job that is skipped because a job it needs FAILED as not blocking the merge, so a plain
    # `needs` would turn a broken `detect` into three green required checks.
    if: ${{ !cancelled() && (needs.detect.result != 'success' || needs.detect.outputs.docs-only != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '22' }
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/docker-hub-mirror
      - name: Run smoke (build + up + playwright + teardown)
        run: bash scripts/smoke-local.sh --verbose
      - name: Upload playwright trace artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-playwright-traces
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

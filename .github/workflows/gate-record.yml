name: gate-record

# The merge rule in CLAUDE.md — every relevant gate ran, findings fixed, a delta
# round on the fixes came back clean, CI green — was prose for four revisions and
# lost to the default every time. This job is the mechanism.
#
# What it can and cannot do, stated plainly because the difference matters: CI
# cannot judge whether a review was any good, so most of the record is an
# ATTESTATION. It does pin the head SHA itself,
# and that is the failure that actually recurs: the gates ran, then three more
# commits landed and nobody re-ran them. `synchronize` re-runs this job on every
# push, so the record goes red the moment it stops describing the code.
#
# `edited` is in the trigger list because the record lives in the PR body: without
# it, fixing a stale record would need a dummy commit.
#
# EXPECT A RED RUN AFTER EVERY PUSH, then a green one. That is not flakiness: the
# push fires `synchronize`, and at that instant the record genuinely does describe
# an older commit. Updating `head:` fires `edited` and the check goes green.
# Branch protection reads the LATEST run for the name, so the earlier red does not
# block the merge — it stays in the list as the receipt that the record was
# re-taken rather than left behind.
#
# This job is a required status check on main — AND `enforce_admins` is false on
# this repo, so `gh pr merge --admin` overrides it exactly as it overrides every
# other required check. That is not a hole this job opened and not one it can
# close; the override exists because a broken check must not be able to freeze a
# release, which stopped being hypothetical the day this one went red on its own
# PR twice. Read "required" as "you have to decide to skip it", not as "you
# cannot". The §4b pre-`--admin` green-bundle rule in CLAUDE.md still applies.
#
# One cost of turning it on, recorded because it surprised me: an open PR whose
# branch predates this workflow gets NO run at all, so the required check sits at
# "expected" forever and the PR cannot merge. Editing the body does not help —
# the workflow has to exist in the PR's merge ref. `gh pr update-branch` is the
# fix; a PR with conflicts cannot be rescued that way at all, but it could not
# merge anyway.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  gate-record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Need both endpoints to list what the PR changes.
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Check the record against this head
        # Everything reaches the script through the filesystem or argv, never
        # through a shell interpolation: the body is author-controlled text and
        # would otherwise be a command-injection sink in our own CI.
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          # Needed to reach this PR's head after its branch is gone — see the run block.
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # The PROPERTY, from GitHub's own payload — not the repo name, which is a proxy that a
          # rename breaks without a symptom. The script fails CLOSED (treats the record as public)
          # when this is absent, which for THIS repo is also the correct answer.
          REPO_PRIVATE: ${{ github.event.pull_request.base.repo.private }}
        run: |
          set -euo pipefail
          printf '%s' "$PR_BODY" > /tmp/pr-body.txt
          # Three dots: what the BRANCH changed, from the merge base. Two dots
          # compares the two trees, so once main moves ahead every file changed
          # there shows up as this PR's — which reds a docs-only PR the moment
          # somebody else lands code, and the script's own list is then wrong.
          # ⚠ `edited` fires on MERGED PRs too, and then TWO things combine.
          # `delete_branch_on_merge` is on, so the head is reachable from no branch; and for a
          # merged PR this event resolves to the BASE branch at the merge commit, so
          # `actions/checkout` builds a local `main` and never asks for `refs/pull/<n>/merge`.
          # On an OPEN PR it does ask, and the head arrives for free as that merge commit's second
          # parent — which is why none of this can happen there. Both ingredients are needed.
          #
          # Measured on lynox-ai/lynox#1577 on 2026-10-08: correcting the body after the merge left
          # this required check red with a bare `fatal: Invalid symmetric difference expression` and
          # exit 128, before the script could print its own fail-closed refusal. A required check
          # that reds for a reason nobody can act on is what teaches that reds are decorative, and
          # this job exists as a mechanism because prose lost to exactly that.
          #
          # The head survives as `refs/pull/<n>/head`, which the server keeps serving, so fetch it
          # when — and only when — the object is missing; on an open PR it never is, so this is
          # inert there. The number arrives through `env` like every other input to this step, never
          # spliced into the shell by the workflow expression syntax.
          if ! git cat-file -e "$HEAD_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags --quiet origin "refs/pull/$PR_NUMBER/head" || true
          fi
          # ⛔ This catches the DIFF FAILING, not the reasons it can fail. The first draft tested
          # each endpoint for presence, which is an enumeration — and a review found a second
          # bare-128 path it did not cover (`fatal: … no merge base`, on disjoint histories). An
          # enumeration needs a new branch per reason; wrapping the command empties that set
          # instead of listing it, and git's own words say which case it was.
          #
          # ⚠ The stderr redirect comes FIRST, before the stdout one, and that order is the
          # whole point of it: bash opens them left to right, so with `>` first a failure to open
          # the file list leaves the error file UNTRUNCATED and the message then quotes a reason
          # from some earlier run. A review round reproduced exactly that. This way the error
          # file is truncated first and bash's own complaint lands inside it.
          #
          # ⚠ `--name-only` is load-bearing for more than brevity: a full diff can be driven
          # through an author-supplied `diff.<driver>.command` via `.gitattributes`, which would
          # put author-controlled text into the stderr this line quotes. Measured by a review
          # round: with `--name-only` that channel produces nothing; without it, it produces the
          # author's string. `tr` below removes the newlines either way, so no quoted text can
          # begin a line and forge a workflow command — but do not drop either of them.
          if ! git diff --name-only "$BASE_SHA...$HEAD_SHA" 2>/tmp/pr-diff-err > /tmp/pr-files.txt; then
            echo "::error::gate-record: could not compute this PR's diff ($BASE_SHA...$HEAD_SHA) — refusing to pass on a diff this check cannot see. git said: $(tr '\n' ' ' < /tmp/pr-diff-err)"
            exit 1
          fi
          node scripts/gate-record.mjs \
            --body-file /tmp/pr-body.txt \
            --head "$HEAD_SHA" \
            --files-file /tmp/pr-files.txt \
            --author "$PR_AUTHOR"

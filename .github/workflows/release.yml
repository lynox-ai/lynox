name: Release

on:
  release:
    types: [published]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Scoped for the same reason as ci.yml's `test`: this job downloads a
    # third-party executable, runs it over the checkout, and hands the install
    # action a token.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '22' }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
      - run: pnpm install --frozen-lockfile
      # Dep-scan gate: the osv-scanner HIGH/CRITICAL check lives in ci.yml's test
      # job but NOT here, so a release could ship a vulnerable lockfile even while
      # ci.yml is red. Mirror the scan so the release build refuses to publish a
      # HIGH/CRITICAL dep (closes the "vuln creeps into a release" gap, 2026-07-18).
      - uses: ./.github/actions/install-osv-scanner
        with:
          token: ${{ github.token }}
      # Same gate as ci.yml, same script — the publish path used to carry its
      # own copy of the severity rules, so a finding this repo refused to merge
      # could still be shipped by a tag push.
      - name: Scan dependencies (high+critical hard-fail)
        run: |
          set -euo pipefail
          set +e
          osv-scanner scan source --lockfile=pnpm-lock.yaml --format=json --output-file=/tmp/osv.json
          OSV_RC=$?
          set -e
          node scripts/osv-report-gate.mjs --report /tmp/osv.json --rc "${OSV_RC}"
      - run: pnpm run typecheck
      - run: pnpm exec vitest run

  # Gate: verify NPM_TOKEN is valid before any docker/npm side effects.
  # Protects against token drift — see scripts/pre-release-check.sh for history.
  pre-release-check:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify NPM_TOKEN is valid
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: ./scripts/pre-release-check.sh

  # Matrix split: each platform builds on its native arch runner — no QEMU.
  # Each matrix job pushes its image by digest only (no human-readable tag
  # yet); the `docker-manifest` job below stitches both digests into the
  # final multi-arch tags via `docker buildx imagetools create`.
  # Pattern documented at
  # https://docs.docker.com/build/ci/github-actions/multi-platform/#distribute-build-across-multiple-runners
  #
  # `fail-fast: true` — if amd64 fails, don't bother finishing arm64.
  docker-build:
    needs: pre-release-check
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch_tag: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch_tag: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # amd64-only: build with load+tag-for-scan so trivy can read the same
      # layers we ship. arm64's base image (node:22-alpine) has the same
      # OS-package surface as amd64's, so a second arm64 scan adds zero CVE
      # coverage — keep it amd64-only to match prior behavior. The
      # push-by-digest build below re-uses the gha cache, so this step is
      # essentially free on its second invocation.
      - name: Build (load) for trivy scan
        if: matrix.platform == 'linux/amd64'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: ghcr.io/lynox-ai/lynox:scan
          build-args: |
            BUILD_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.arch_tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch_tag }}

      - name: Scan image for vulnerabilities
        if: matrix.platform == 'linux/amd64'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/lynox-ai/lynox:scan
          format: table
          exit-code: '1'
          severity: CRITICAL
          ignore-unfixed: true

      - name: Extract version from release tag
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_CREATED: ${{ github.event.release.created_at }}
        run: |
          # Strip leading 'v' if present (v1.0.0 -> 1.0.0)
          VERSION="${RELEASE_TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "created=${RELEASE_CREATED}" >> "$GITHUB_OUTPUT"

      # Push by digest only — no human-readable tag yet. The manifest job
      # below stitches the per-arch digests into `:latest`, `:${version}`,
      # `:${sha}`. push-by-digest=true + name-canonical=true is the
      # canonical multi-runner pattern. OCI labels are baked into each
      # per-arch image config here so they survive the imagetools stitch.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/lynox-ai/lynox,push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.version.outputs.created }}
          build-args: |
            BUILD_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.arch_tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch_tag }}

      - name: Export digest
        env:
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          # Strip the "sha256:" prefix for a filesystem-safe filename; the
          # manifest job re-applies the prefix when constructing image refs.
          touch "/tmp/digests/${BUILD_DIGEST#sha256:}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digests-${{ matrix.arch_tag }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Stitch the per-arch digests into the final multi-arch tags. This is the
  # only job that produces human-readable tags — `docker-build` only pushes
  # by digest. `docker buildx imagetools create` builds a manifest list and
  # pushes it under each requested tag in one round trip per tag.
  docker-manifest:
    needs: docker-build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from release tag
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_CREATED: ${{ github.event.release.created_at }}
        run: |
          # Strip leading 'v' if present (v1.0.0 -> 1.0.0)
          VERSION="${RELEASE_TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "created=${RELEASE_CREATED}" >> "$GITHUB_OUTPUT"

      - name: Create multi-arch manifest
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Re-apply the "sha256:" prefix that we stripped when exporting digests.
          DIGEST_REFS=()
          for f in /tmp/digests/*; do
            digest_name="$(basename "$f")"
            DIGEST_REFS+=("ghcr.io/lynox-ai/lynox@sha256:${digest_name}")
          done
          if [ "${#DIGEST_REFS[@]}" -ne 2 ]; then
            echo "Expected 2 digests (amd64+arm64), got ${#DIGEST_REFS[@]}: ${DIGEST_REFS[*]}"
            exit 1
          fi
          for TAG in \
            "ghcr.io/lynox-ai/lynox:latest" \
            "ghcr.io/lynox-ai/lynox:${VERSION}" \
            "ghcr.io/lynox-ai/lynox:${SHA}"; do
            echo "::group::Creating manifest $TAG"
            docker buildx imagetools create -t "$TAG" "${DIGEST_REFS[@]}"
            echo "::endgroup::"
          done

      # Verify the multi-arch manifest landed — fails the workflow if either
      # arch is missing. Pre-launch we cannot ship a workflow that silently
      # regresses to single-arch.
      - name: Verify multi-arch manifest
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          INSPECT=$(docker buildx imagetools inspect "ghcr.io/lynox-ai/lynox:${VERSION}" --raw)
          echo "$INSPECT"
          echo "$INSPECT" | grep -q '"architecture": "amd64"' || { echo "amd64 missing from manifest"; exit 1; }
          echo "$INSPECT" | grep -q '"architecture": "arm64"' || { echo "arm64 missing from manifest"; exit 1; }
          echo "Multi-arch manifest verified: amd64 + arm64 both present."

  npm:
    needs: pre-release-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Production docs deploy to Cloudflare Pages (lynox-docs project, main branch).
  # Staging docs deploy runs on every main push via docs.yml; this job only
  # fires on a release tag and maps to the production custom domain.
  deploy-docs-prod:
    needs: [docker-manifest, npm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '22' }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
      - run: pnpm install --frozen-lockfile
        working-directory: docs
      - run: pnpm build
        working-directory: docs

      - name: Deploy to Cloudflare Pages (production)
        working-directory: docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name=lynox-docs --branch=main --commit-dirty=true

  # Cross-repo dispatch to lynox-pro for the production control plane deploy.
  # Pro listens for `engine-release-published` in release-control-plane.yml
  # (rsync + migrate + rebuild). The website no longer does: its release trigger
  # was removed on 2026-09-06 and it deploys by hand (workflow_dispatch).
  # Keeps the prod admin token + control plane SSH key out of this public repo.
  #
  # Gate: `environment: production` on this job. The environment carries one
  # protection rule, `required_reviewers`, so the job — and with it the dispatch,
  # i.e. the release-triggered PRODUCTION deploy of the control plane — waits
  # until a reviewer approves it. The core release itself does NOT wait: images
  # and the npm package are already published by the jobs this one `needs`, and
  # `deploy-docs-prod` (the public docs) is a separate job this gate does not
  # cover.
  #
  # What it is, stated precisely so nobody reads more into it: a PAUSE until a
  # human has looked, not a barrier. It has ONE required reviewer, who is also a
  # repository admin; the environment allows admins to bypass it
  # (`can_admins_bypass: true`) and does not prevent self-review
  # (`prevent_self_review: false`). So it holds the deploy until that person acts
  # — it does not stop anyone with admin rights. It also holds only THIS path: the
  # control-plane workflow in pro can still be started by hand (workflow_dispatch)
  # or re-run, and pro's own `production` environment has no protection rule. GitHub lets a run wait up to 30 days for
  # an environment approval; the cost is the delay until someone approves, and
  # one approval per release. Measured the last time this gate existed (core#142's
  # commit message): v1.3.1–v1.3.3 sat unapproved for 40 h, 38 h and ~1 h, and the
  # website and control plane were rsynced by hand instead — a gate nobody
  # answers turns into a manual path around it.
  #
  # History: core#142 (2026-04-23) removed this key because the reviewer gate
  # held releases for hours. It is back by decision on 2026-10-01: until then
  # every core release moved the control plane to production with no human
  # pause.
  #
  # Security: release tag + sha go through env vars (never interpolated
  # directly into the shell command), and the JSON payload is built with
  # `jq -n` to avoid injection via a crafted tag. PRO_DISPATCH_TOKEN is a
  # fine-grained PAT scoped to the deployment repository; treat it as a
  # write credential there and rotate it like one.
  dispatch-pro-release:
    needs: [docker-manifest, npm]
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Kept although the explicit record step is gone: before core#142 this job
      # had no permissions block at all, so it is not measured whether the
      # environment's own Deployment object needs this scope. Removing it is a
      # separate, measured change.
      deployments: write
    steps:
      - name: Dispatch release to lynox-pro
        env:
          PRO_DISPATCH_TOKEN: ${{ secrets.PRO_DISPATCH_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          PAYLOAD=$(jq -n \
            --arg version "$VERSION" \
            --arg tag "$RELEASE_TAG" \
            --arg sha "$RELEASE_SHA" \
            '{event_type: "engine-release-published", client_payload: {version: $version, tag: $tag, sha: $sha}}')
          curl -sSf -X POST \
            -H "Authorization: Bearer $PRO_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/lynox-ai/lynox-pro/dispatches \
            -d "$PAYLOAD"

      # No explicit Deployment record any more: with `environment: production` on
      # the job, GitHub creates the Deployment object itself. Measured on this
      # repo's production deployments: v1.0.5–v1.3.3 (job had the environment, no
      # record step) carry GitHub-created deployments; v1.3.4–v1.3.6 (neither)
      # carry none; from v1.3.7 the record step created them. Keeping that step
      # next to the environment would book every release twice.

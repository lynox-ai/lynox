# SearXNG settings for lynox — optimized for AI agent web research.
# Mounted into the SearXNG container via docker-compose.
# Full reference: https://docs.searxng.org/admin/settings/

use_default_settings:
  engines:
    keep_only:
      # General — broadened beyond the Google/DDG/Bing trio because
      # DuckDuckGo in particular rate-limits requests from fresh
      # container IPs, producing silent zero-result responses. Adding
      # independent crawlers (brave, mojeek) and EU-friendly engines
      # (qwant, startpage) gives the aggregator a larger quorum so a
      # single flaky upstream cannot kill a query.
      - google
      - duckduckgo
      - bing
      - brave
      - qwant
      - startpage
      - mojeek
      - wikipedia
      - wikidata
      - currency
      # News
      - google news
      - duckduckgo news
      - bing news
      # Science
      - google scholar
      - semantic scholar
      - arxiv
      # IT
      - github
      - stackoverflow
      - npm
      - pypi

general:
  debug: false
  instance_name: "lynox-search"
  enable_metrics: false

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "auto"
  formats:
    - html
    - json

server:
  port: 8080
  bind_address: "0.0.0.0"
  # ⚠ This key is CHECKED IN and therefore public — it is a placeholder, not a
  # secret. `npx @lynox-ai/core` generates a random one per install; this file
  # is the git-clone path, so replace it: openssl rand -base64 32
  secret_key: "dQw4w9WgXcQ8Zk3pR7mN2vB6hJ5fT1xL0cY9uA4oE8s="
  # No host port is published, so this is unreachable off the machine. It is
  # NOT unreachable on the machine: on a Linux host, host processes and any
  # container on the same Compose network can reach it (measured 2026-08-10).
  # `limiter: false` therefore rests on the host being trusted, not on the
  # service being isolated. Turn the limiter on if that does not hold for you.
  limiter: false
  public_instance: false
  image_proxy: false
  method: "GET"

ui:
  default_theme: simple
  query_in_title: false

outgoing:
  request_timeout: 5.0
  pool_connections: 100
  pool_maxsize: 20
  enable_http2: true

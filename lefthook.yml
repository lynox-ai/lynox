commit-msg:
  commands:
    no-ai-attribution:
      # The harness's system prompt tells the agent to append `Co-Authored-By: Claude`
      # + `Claude-Session:` to every commit. CLAUDE.md forbids both. Prose lost that
      # fight 332 times on main (32 of the last 100 commits), so this strips them.
      #
      # It STRIPS and exits 0 rather than failing: a hook that aborts a commit over a
      # trailer the harness inserted teaches people to reach for --no-verify. The gate
      # for the bypassed case is the `no-ai-attribution` CI job, which fails.
      # A human Co-Authored-By is left alone.
      run: bash scripts/no-ai-attribution.sh strip {1}

pre-push:
  commands:
    security-scan:
      run: sh scripts/security-scan.sh
    default-on-inventory:
      # What runs when an operator configures nothing? v2.11.0 shipped a config
      # flag reading `?? true`, so a new HTML parser went live fleet-wide without
      # anyone deciding it. Pairs with the `default-on-inventory` CI job, which is
      # the gate for the bypassed case.
      run: bash scripts/default-on-inventory.sh
    public-repo-guard:
      # Block internal infra / control-plane / ops leaks (staging hostnames,
      # CP DB schema, SSH-as-root chains) from reaching this PUBLIC repo —
      # the class gitleaks doesn't catch. Scans the whole tracked tree; the
      # CI job re-runs it so `git push --no-verify` can't slip a leak past.
      run: bash scripts/public-repo-guard.sh
      skip:
        - merge
        - rebase
    public-repo-guard-meta:
      # The customer-name class does NOT scan the tree — it scans commit
      # messages, which is where that leak actually happens and the one surface
      # that cannot be edited after a merge. So it needs its own invocation:
      # without this the class would be enforced nowhere at all locally, since
      # the scan above never looks at a message.
      #
      # merge-base gives the commits this push adds, relative to HEAD. Known
      # limit, stated rather than hidden: pushing a branch you are not standing
      # on (`git push origin other`) computes the range from HEAD, so it walks
      # nothing. That case prints "NO commits scanned" — visible, not silent —
      # and this class has no CI twin to catch it afterwards.
      #
      # Without ~/.lynox/private-names.re the class warns and stands down rather
      # than blocking: an unpushable hook is how people learn --no-verify.
      # The `|| echo HEAD` is load-bearing. Without it, a clone that has no local
      # origin/main — a --single-branch clone, a differently named remote, a repo
      # with no origin at all — makes the substitution empty, the guard sees a
      # missing argument and exits 2, and the push is BLOCKED for a reason its
      # message never mentions. Falling back to HEAD yields an empty range, which
      # the guard reports as "NO commits" and lets through: it says it checked
      # nothing rather than blocking. That is the deliberate trade, and it is NOT
      # softened by a CI twin — this class has none (see the comment above, and
      # CLAUDE.md). It is chosen because a hook nobody can push through is how
      # people learn --no-verify, and because the state it lets through announces
      # itself in the output instead of passing as a clean scan.
      run: bash scripts/public-repo-guard.sh check-meta "$(git merge-base origin/main HEAD 2>/dev/null || echo HEAD)" HEAD
      skip:
        - merge
        - rebase
    drift-guard:
      # Catch the mechanizable slices of doc/code drift gitleaks + public-repo-
      # guard don't: committed merge-conflict markers, removed features (Telegram
      # /WhatsApp/MCP) reappearing in live docs, and dead `path/file` references
      # in CLAUDE.md / docs / READMEs. Re-run by CI so --no-verify can't bypass.
      run: bash scripts/drift-guard.sh
      skip:
        - merge
        - rebase
    positioning-guard:
      # Checks public copy against the internal positioning source.
      # Tightly scoped to copy surfaces.
      run: bash scripts/positioning-guard.sh
      skip:
        - merge
        - rebase

pre-commit:
  commands:
    # gitleaks/pattern-scan belong here, not pre-push: `--staged` and
    # `git diff --cached` only see content at COMMIT time (the index is empty at
    # push), so at pre-push they were no-ops. CI `gitleaks detect` is the real gate.
    gitleaks:
      run: gitleaks protect --staged --verbose
      skip:
        - merge
        - rebase
    pattern-scan:
      run: >-
        git diff --cached --name-only -z |
        xargs -0 grep -rlE
        '(sk-ant-|AKIA[A-Z0-9]{16}|ghp_[a-zA-Z0-9]{36}|xoxb-|xapp-|-----BEGIN (RSA |EC )?PRIVATE KEY-----)'
        -- || true
      fail_text: "Potential secrets detected in staged files"
    typecheck:
      # A fresh worktree has no node_modules, and the typecheck then dies deep inside
      # tsc/pnpm output where the real cause is invisible. What the operator sees is not
      # "install your dependencies" — it is a failed commit, then `git push` creating an
      # EMPTY branch, then `gh pr create` saying "No commits between". Three documented
      # occurrences on 2026-08-20 alone, in three different sessions, against a rule that
      # is written in /track step 3 and in two memory files. Prose lost; this is the
      # mechanism. A loud one-line refusal beats a rule everyone has already read.
      run: |
        test -d node_modules || {
          echo ""
          echo "  ✋ node_modules is missing in this worktree — the typecheck cannot run."
          echo "     Run:  pnpm install --force"
          echo ""
          echo "     (A fresh worktree needs this once. Without it the commit fails here,"
          echo "      the push creates an empty branch, and gh pr create reports"
          echo "      \"No commits between\" — three sessions hit exactly that on 2026-08-20.)"
          echo ""
          exit 1
        }
        npm run typecheck
      stage_fixed: true
    hex-guard:
      # Fail if a web-ui change introduces hardcoded 6-digit hex outside the
      # allowlisted asset-export / categorical paths.
      run: bash packages/web-ui/scripts/hex-guard.sh
      skip:
        - merge
        - rebase
    token-contract:
      # hex-guard allowlists app.css — "the token definitions themselves" — so
      # nothing guarded the VALUES in it. These primitives are painted on more
      # than one surface (this UI, and the lynox.ai site, a separate codebase),
      # so a change here is a change over there. Fail now, on your commit,
      # rather than by someone else weeks later.
      #
      # Fast local feedback only. The gate is .github/workflows/token-contract.yml
      # — `--no-verify` skips this hook, not that.
      glob:
        - "packages/web-ui/src/app.css"
        - "packages/web-ui/tokens.contract.json"
      run: node packages/web-ui/scripts/check-token-contract.mjs
      skip:
        - merge
        - rebase
    shape-contract:
      # The colour half of the contract stopped the two surfaces' TOKENS drifting.
      # Nothing stopped their SHAPES: a design system draws the chat turn, the tool
      # call, the inbox row and the state surface by hand, from reading these
      # components, and two of the four were wrong within a week of being drawn.
      # shapes.contract.json is that reading, written down; this asserts the
      # components still have the shapes it records.
      #
      # Globs every component it cites, not just the contract — the drift that matters
      # is someone restyling a shape here without knowing it is drawn over there.
      #
      # Fast local feedback only. The gate is the same workflow.
      glob:
        - "packages/web-ui/shapes.contract.json"
        - "packages/web-ui/src/lib/components/*.svelte"
        - "packages/web-ui/src/lib/primitives/*.svelte"
      run: node packages/web-ui/scripts/check-shape-contract.mjs
      skip:
        - merge
        - rebase
